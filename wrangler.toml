name = "rak-module"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Layani frontend web SPA (dist/) secara otomatis dari Cloudflare Edge CDN
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
SUPABASE_URL = "https://your-project.supabase.co"

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rak-modul-storage"

# Cron trigger: Berjalan tiap 3 hari pukul 00:00 UTC untuk mencegah jeda Supabase free tier
[triggers]
crons = ["0 0 */3 * *"]
