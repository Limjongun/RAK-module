name = "rak-module"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Layani frontend web SPA (dist/) secara otomatis dari Cloudflare Edge CDN
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare D1 Serverless SQL Database (100% Gratis 5 GB)
[[d1_databases]]
binding = "DB"
database_name = "rakmodule"
database_id = "16f56c82-a999-465d-8bca-ff4ccc79e0cd"

[vars]
SUPABASE_URL = "https://your-project.supabase.co"

# Cron trigger: Berjalan tiap 3 hari pukul 00:00 UTC
[triggers]
crons = ["0 0 */3 * *"]
