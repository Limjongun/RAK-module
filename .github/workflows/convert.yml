name: Convert Office Documents to PDF

on:
  repository_dispatch:
    types: [convert-document]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice libreoffice-pdfimport

      - name: Download Original Document from R2
        env:
          FILE_KEY: ${{ github.event.client_payload.file_key }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          echo "Downloading $FILE_KEY..."
          mkdir -p input output

      - name: Convert to PDF with LibreOffice Headless
        run: |
          libreoffice --headless --convert-to pdf input/* --outdir output/

      - name: Notify Worker of Conversion Completion
        run: |
          echo "Conversion finished, ready for download."

